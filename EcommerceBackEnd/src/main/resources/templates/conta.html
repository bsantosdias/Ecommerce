<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragmentos :: header('Suas informações', 'none')" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<body>
	<div class="container-fluid">
		<div th:replace="menu_navegacao :: menu"></div>

		<form th:action="@{/conta/atualizar}" method="post"
			style="max-width: 700px; margin: 0 auto" th:object="${usuario}">
			<input type="hidden" th:field="*{id}">
			<div class="text-center">
				<h2>Minha Conta</h2>
			</div>

			<div th:if="${message != null}"
				class="alert alert-success text-center ">[[${message}]]</div>

				<div class="border border-secondary rounded p-3">

					<div class="form-group row m-2 ">
						<label class="col-sm-4 col-form-label">E-mail</label>
						<div class="col-sm-8">
							<input type="email" class="form-control" th:field="*{email}"
								readonly="readonly" />
						</div>
					</div>
					<div class="form-group row m-2">
						<label class="col-sm-4 col-form-label">Nome</label>
						<div class="col-sm-8">
							<input type="text" class="form-control" th:field="*{nome}"
								required minlength="5" maxlength="100" />
						</div>
					</div>
					<div class="form-group row m-2">
						<label class="col-sm-4 col-form-label">CPF</label>
						<div class="col-sm-8">
							<input th:if="${usuario.id == null}" type="text"
								class="form-control" th:field="*{cpf}" required minlength="5"
								maxlength="100" /> <input th:if="${usuario.id != null}"
								type="text" class="form-control" th:field="*{cpf}"
								readonly="readonly" />
						</div>
					</div>
					<div class="form-group row m-2">
						<label class="col-sm-4 col-form-label">Nascimento</label>
						<div class="col-sm-8">
							<input type="text" class="form-control" th:field="*{nascimento}"
								required minlength="5" maxlength="100" />
						</div>
					</div>
					<div class="form-group row m-2">
						<label class="col-sm-4 col-form-label">Telefone</label>
						<div class="col-sm-8">
							<input type="tel" class="form-control" th:field="*{telefone}"
								required minlength="5" maxlength="100" />
						</div>
					</div>
					<div class="form-group row m-2">
						<label class="col-sm-4 col-form-label">Senha</label>
						<div class="col-sm-8">
							<input type="password" th:field="*{senha}"
								placeholder="Insira a nova senha" class="form-control"
								minlength="6" maxlength="20" 
								oninput="validarSenhas(document.getElementById('confirmarSenha'))" />
						</div>
					</div>

					<div class="form-group row m-2">
						<label class="col-sm-4 col-form-label">Confirmar Senha</label>
						<div class="col-sm-8">
							<input type="password" id="confirmarSenha" class="form-control"
								minlength="6" maxlength="20" oninput="validarSenhas(this)" />
						</div>
					</div>


					<div class="form-group row m-2">
						<label class="col-sm-4 col-form-label">Cargo Definido: </label>
						<div class="col-sm-8">
							<span><b>[[${usuario.cargos}]]</b></span>
						</div>
					</div>
					<div class="form-group row m-2">
						<label class="col-sm-4 col-form-label">Ativado</label>
						<div class="col-sm-8">
							<input type="checkbox" th:field="*{ativado}" class="m-2" />
						</div>
					</div>
					<div class="text-center">
						<input type="submit" value="Salvar" class="btn btn-primary m-3" />
						<input type="button" value="Cancelar" class="btn btn-secondary"
							id="botaoCancelar" />
					</div>
				</div>
		</form>

		<div class="modal fade text-center" id="modalDialog">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h4 class="modal-title" id="modalTitle">Aviso</h4>
						<button type="button" class="close" data-bs-dismiss="modal">&times;</button>
					</div>
					<div class="modal-body">
						<span id="modalBody"></span>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-danger"
							data-bs-dismiss="modal">Fechar</button>
					</div>
				</div>
			</div>
		</div>

	</div>
	<script type="text/javascript">
		$(document).ready(function() {
			$("#botaoCancelar").on("click", function() {
				window.location = "[[@{/}]]";
			});
		});

		function validarSenhas(confirmarSenha) {
			if (confirmarSenha.value != $("#senha").val()) {
				confirmarSenha.setCustomValidity("Senhas diferentes!");
			}else{
				confirmarSenha.setCustomValidity("");
			}
		}
	</script>
</body>
</html>
