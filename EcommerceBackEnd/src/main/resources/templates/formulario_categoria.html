<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragmentos :: header(${titulo}, 'none')" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<body>
	<div class="container-fluid">
		<div th:replace="menu_navegacao :: menu"></div>
		<div>
			<h2>[[${titulo}]]</h2>
		</div>
		<form th:action="@{/categorias/salvar}" method="post"
			 th:object=${categoria}>
			<input type="hidden" th:field="*{id}">

			<div class="border border-secondary rounded p-3">
				<div class="form-group row m-2 ">
					<label class="col-sm-4 col-form-label">Nome da Categoria: </label>
					<div class="col-sm-8">
						<input type="text" class="form-control" th:field="*{categoria}"
							minlength="5" maxlength="128" />
					</div>
				</div>
				
				<div class="form-group row m-2 ">
					<label class="col-sm-4 col-form-label">Imagem </label>
					<div class="col-sm-8">
						<input type="file" id="arquivoImagem" accept="image/png, image/jpeg" class="form-control" th:field="*{imagem}"
							minlength="5" maxlength="128" />
					</div>
				</div>
				
				<div class="form-group row m-2 ">
					<label class="col-sm-4 col-form-label">Imagem </label>
					<div class="col-sm-8">
						<input type="file" class="form-control" th:field="*{categoria}"
							minlength="5" maxlength="128" />
					</div>
				</div>
				
				
				<div class="form-group row m-2">
					<label class="col-sm-4 col-form-label">Ativado</label>
					<div class="col-sm-8">
						<input type="checkbox" th:field="*{ativado}" class="m-2" />
					</div>
				</div>
				<div class="text-center">
					<input type="submit" value="Salvar" class="btn btn-primary m-3" />
					<input type="button" value="Cancelar" class="btn btn-secondary"
						id="botaoCancelar" />
				</div>
			</div>
		</form>

		<div class="modal fade text-center" id="modalDialog">
			<div class="modal-dialog">
				<div class="modal-content">
					<div class="modal-header">
						<h4 class="modal-title" id="modalTitle">Aviso</h4>
						<button type="button" class="close" data-bs-dismiss="modal">&times;</button>
					</div>
					<div class="modal-body">
						<span id="modalBody"></span>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-danger"
							data-bs-dismiss="modal">Fechar</button>
					</div>
				</div>
			</div>
		</div>

	</div>
	<script type="text/javascript">
		$(document).ready(function() {
			$("#botaoCancelar").on("click", function() {
				window.location = "[[@{/categorias}]]";
			});
		});
		
		function showModalDialog(title, message) {
			$("#modalTitle").text(title);
			$("#modalBody").text(message);
			$("#modalDialog").modal("show");

		}
	</script>
</body>
</html>
