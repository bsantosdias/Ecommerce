<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<body>
	<div th:fragment="contexto" th:remove="tag" class="text-center">
		<div class="form-group row">
		
		</div>
		<div class="from-group row">
			<label class="col-sm-2 col-form-label">Comprimento: </label>
			<div class="col-sm-10">
				<input type="number" class="form-control" th:field="*{comprimento}" required/>
			</div>
		</div>
		<div class="from-group row">
			<label class="col-sm-2 col-form-label">Altura: </label>
			<div class="col-sm-10">
				<input type="number" class="form-control" th:field="*{altura}" required/>
			</div>
		</div>
		<div class="from-group row">
			<label class="col-sm-2 col-form-label">Largura: </label>
			<div class="col-sm-10">
				<input type="number" class="form-control" th:field="*{largura}" required/>
			</div>
		</div>
		<div class="from-group row">
			<label class="col-sm-2 col-form-label">Peso: </label>
			<div class="col-sm-10">
				<input type="number" class="form-control" th:field="*{peso}" required/>
			</div>
		</div>
	</div>
</body>

</html>
