<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<body>
	<div th:fragment="contexto" th:remove="tag" class="text-center">
		<div class="from-group row">
			<label class="col-sm-2 col-form-label">Nome</label>
			<div class="col-sm-10">
				<input type="text" class="form-control" th:field="*{nome}" required
					minlength="5" maxlength="256" />
			</div>
		</div>

		<!--  
			<div class="from-group row">
				<label class="col-sm-2 col-form-label">Categoria</label>
					<div class="col-sm-10">
						<select th:field="*{categoria}" class="form-control" required>
							<th:block th:each="categoria : ${listaCategoria}">
									<option th:value="categoria.id">
										{categoria.nome}
									</option>
							</th:block>
						</select>
					</div>
			</div>
			-->
		

		<div class="form-group row m-2 ">
			<label class="col-sm-2 col-form-label">Ativado</label>
			<div class="col-sm-10">
				<input type="checkbox" th:field="*{ativado}" class="m-2" />
			</div>
		</div>

		<div class="form-group row m-2">
			<label class="col-sm-2 col-form-label">Em Estoque</label>
			<div class="col-sm-10">
				<input type="checkbox" th:field="*{emEstoque}" class="m-2" />
			</div>
		</div>
		
		<div class="from-group row">
			<label class="col-sm-2 col-form-label">Preço: </label>
			<div class="col-sm-10">
				<input type="number" step="0.01" class="form-control" th:field="*{preco}"/>
			</div>
		</div>
		<div class="from-group row">
			<label class="col-sm-2 col-form-label">Quantidade: </label>
			<div class="col-sm-10">
				<input type="number" class="form-control" th:field="*{quantidade}" required/>
			</div>
		</div>
		<div class="from-group row">
			<label class="col-sm-2 col-form-label">Porcentagem de Desconto: </label>
			<div class="col-sm-10">
				<input type="number" class="form-control" th:field="*{porcentagemDesconto}" />
			</div>
		</div>
	</div>
</body>

</html>
